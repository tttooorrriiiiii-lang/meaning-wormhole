<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ことばの森｜関係でたどる辞書</title>
  <style>

*{box-sizing:border-box}
:root{
  --bg:#0b0c16;--panel:#151625;--panel2:#0e0f19;--text:#f7f5ef;--muted:#aaa6b7;
  --line:#ffffff18;--lime:#d9ff72;--purple:#b69dff;
}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
main{max-width:900px;margin:auto;padding:18px 14px 80px}
header{font-weight:900;letter-spacing:.01em}
h1{font-size:clamp(34px,8vw,64px);line-height:1.03;letter-spacing:-.045em;margin:36px 0 12px}
h1 em{font-style:normal;color:var(--purple)}
.lead{color:#c0bccb;line-height:1.7;max-width:690px}
.search-card,.dictionary-card,.galaxy-card,.compare-card{
  background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:20px
}
.search-row{display:flex;gap:8px}
.search-input{flex:1;min-width:0;background:var(--panel2);border:1px solid #ffffff25;border-radius:13px;color:#fff;padding:14px 15px;font-size:17px}
.search-button{border:0;border-radius:13px;background:var(--lime);color:#12150d;padding:12px 17px;font-weight:900}
.examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.examples button{border:0;background:transparent;color:#928e9e;padding:4px 2px}
.status{font-size:12px;color:#bcb7c8;min-height:22px;padding-top:9px}

.section-kicker{font-size:11px;color:#8f8a9c;letter-spacing:.08em;font-weight:900}
.word-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word-line h2{font-size:30px;margin:5px 0 0}
.domain{font-size:11px;color:var(--lime);border:1px solid #d9ff7235;border-radius:999px;padding:4px 8px}
.definition{font-size:15px;line-height:1.8;margin:12px 0;color:#dedbe4}
.source-badges,.trait-list{display:flex;gap:6px;flex-wrap:wrap}
.badge,.trait{border:1px solid #ffffff18;border-radius:999px;padding:6px 9px;font-size:11px}
.badge{color:#9691a2}
.trait{background:#11121d;color:#f4f1f8}
.block-title{font-size:13px;margin:17px 0 8px;color:#d8d4df}

.relation-groups{display:grid;gap:10px;margin-top:16px}
.relation-group{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:start;border-top:1px solid #ffffff10;padding-top:10px}
.relation-label{font-size:11px;color:#8f8a9c;padding-top:6px;font-weight:800}
.relation-words{display:flex;gap:6px;flex-wrap:wrap}
.relation-word{border:1px solid #ffffff18;background:#0f101a;color:#eeeaf4;border-radius:999px;padding:7px 10px;font-size:12px}
.relation-word:hover{border-color:#d9ff7270}
.relation-word small{color:#817b8e;margin-left:5px}

.galaxy-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:10px}
.galaxy-head h2{margin:4px 0;font-size:27px}
.galaxy-head p{margin:0;color:#908b9b;font-size:11px;max-width:280px;text-align:right}
.galaxy{height:560px;position:relative;border:1px solid #ffffff13;border-radius:26px;overflow:hidden;background:
 radial-gradient(circle at center,#b69dff18 0,transparent 30%),
 radial-gradient(circle at center,transparent 0 31%,#ffffff08 31.2% 31.5%,transparent 31.8%),
 radial-gradient(circle at center,transparent 0 49%,#ffffff07 49.2% 49.5%,transparent 49.8%)}
.galaxy-core,.galaxy-node{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:999px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:3}
.galaxy-core{width:118px;height:118px;background:var(--lime);color:#11140c;padding:10px}
.galaxy-core strong{font-size:20px;overflow-wrap:anywhere}
.galaxy-node{width:var(--node-size);height:var(--node-size);min-width:28px;min-height:28px;border:1px solid #ffffff1d;background:#1e1f32;color:#f8f6fb;padding:5px;transition:.18s transform,.18s border-color,.18s box-shadow,.18s background}
.galaxy-node span{font-size:clamp(8px,1.6vw,12px);max-width:88px;overflow-wrap:anywhere}
.galaxy-node.active{transform:translate(-50%,-50%) scale(1.08);border-color:var(--lime);background:#282a3d;box-shadow:0 0 0 1px #d9ff7260,0 0 18px #d9ff7248}
.active-line{position:absolute;height:4px;background:var(--lime);transform-origin:0 0;z-index:2;box-shadow:0 0 5px #d9ff72cc,0 0 15px #d9ff7280,0 0 28px #d9ff723d}
.empty-galaxy{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);color:#8d8998;font-size:12px;width:80%;text-align:center}

.compare-card[hidden],.sense-card[hidden]{display:none}
.compare-card{border-color:#d9ff7250;box-shadow:0 0 25px #d9ff7212}
.compare-card h2{font-size:28px;margin:5px 0 14px}
.common-label{font-size:11px;color:#8d8998;font-weight:800;letter-spacing:.05em}
.common-traits{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.common-trait{font-size:19px;font-weight:900;background:var(--lime);color:#12150c;border-radius:999px;padding:9px 13px}
.trait-visual{margin-top:14px;border:1px solid #ffffff13;background:#0f101a;border-radius:18px;padding:12px}
.trait-visual-row{display:grid;grid-template-columns:minmax(72px,1fr) auto minmax(72px,1fr);gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff0d}
.trait-visual-row:last-child{border-bottom:0}
.visual-box{border:1px solid #ffffff20;border-radius:13px;min-height:52px;padding:9px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px}
.visual-arrow{text-align:center;color:var(--purple);font-size:20px}
.visual-name{grid-column:1/-1;text-align:center;color:var(--lime);font-size:11px;font-weight:800;margin-top:-2px}

.sense-card{background:#10111b;border:1px solid #ffffff18;border-radius:16px;padding:12px;margin-top:12px}
.sense-card b{display:block;margin-bottom:8px}
.sense-options{display:grid;gap:7px}
.sense-option{border:1px solid #ffffff20;background:#171827;color:#fff;text-align:left;border-radius:12px;padding:11px}
.sense-option small{display:block;color:#9691a2;margin-top:3px}

.loading-dot::after{content:'…';animation:dots 1.1s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}

@media(max-width:650px){
  main{padding-left:12px;padding-right:12px}
  .search-row{display:block}.search-button{width:100%;margin-top:7px}
  .relation-group{grid-template-columns:1fr;gap:4px}
  .galaxy{height:510px}
  .galaxy-head{display:block}.galaxy-head p{text-align:left;margin-top:4px}
  .common-trait{font-size:16px}
}

</style>
</head>
<body>
<main>
  <header>ことばの森</header>

  <h1>ひとつの言葉から、<em>関係</em>が枝になる。</h1>
  <p class="lead">
    意味・種類・用途・性質・動き・部分・反対まで。
    辞書に書かれた関係を枝のようにたどって、言葉がどこへ広がるかを見ます。
  </p>

  <section class="search-card">
    <form id="searchForm" class="search-row">
      <input id="query" class="search-input" autocomplete="off" enterkeyhint="search" placeholder="言葉を入力">
      <button class="search-button" type="submit">調べる</button>
    </form>
    <div id="examples" class="examples"></div>
    <div id="status" class="status" aria-live="polite"></div>

    <div id="senseCard" class="sense-card" hidden>
      <b id="senseTitle"></b>
      <div id="senseOptions" class="sense-options"></div>
    </div>
  </section>

  <section id="dictionaryCard" class="dictionary-card" hidden>
    <div class="section-kicker">DICTIONARY</div>
    <div class="word-line">
      <h2 id="dictWord"></h2>
      <span id="dictDomain" class="domain"></span>
    </div>
    <p id="definition" class="definition"></p>
    <div id="sourceBadges" class="source-badges"></div>

    <div class="block-title">この言葉の性質 <small style="color:#817b8e;font-weight:400">（直接確認できたものだけ）</small></div>
    <div id="traits" class="trait-list"></div>

    <div class="block-title">関係をたどる</div>
    <div id="relationGroups" class="relation-groups"></div>
  </section>

  <section id="galaxyCard" class="galaxy-card" hidden>
    <div class="galaxy-head">
      <div>
        <div class="section-kicker">WORD FOREST</div>
        <h2>性質でつながる枝</h2>
      </div>
      <p><span id="galaxyCount"></span> · 共通する性質が多いほど幹に近い</p>
    </div>
    <div id="galaxy" class="galaxy">
      <div id="activeLine" class="active-line" hidden></div>
      <div class="galaxy-core"><strong>—</strong></div>
      <div id="nodesLayer"></div>
      <div id="emptyGalaxy" class="empty-galaxy" hidden>
        共通する性質がある言葉だけ、枝として表示します。
      </div>
    </div>
  </section>

  <section id="compareCard" class="compare-card" hidden>
    <div class="section-kicker">どこが似てる？</div>
    <h2 id="compareTitle"></h2>
    <div class="common-label">共通する性質</div>
    <div id="commonTraits" class="common-traits"></div>
    <div id="traitVisual" class="trait-visual"></div>
  </section>
</main>






<script>
// Kotoba Forest dictionary data
// 179 curated seed words + trait patterns.
// This file is intentionally local so the app still works when external dictionaries are slow.

const TRAITS={
 simulate:{label:'頭の中で体験する',bridge:'「実際には今ここで起きていない場面を、頭の中で体験する」',re:/夢|想像|空想|映画|物語|シミュレーション/},
 aspire:{label:'未来を目指す',bridge:'「まだ実現していない未来の状態を思い描き、そこへ向かう」',re:/目標|願望|将来|夢|計画|理想/},
 move:{label:'移動する',bridge:'「自分の位置を変えて、別の場所へ移る」',re:/移動|歩く|走る|飛ぶ|泳ぐ|動き回る|移る/},
 eat:{label:'食べる',bridge:'「外から食べ物を取り込み、活動のもとにする」',re:/食べる|捕食|摂食|餌を食べる|餌とする/},
 hunt:{label:'獲物を捕らえる',bridge:'「対象を探して追い、捕らえる」',re:/狩る|狩猟|捕らえる|獲物を捕る|捕食する/},
 hide:{label:'身を隠す',bridge:'「見つかりにくい場所や状態へ移って身を守る」',re:/隠れる|身を隠す|潜む|擬態/},
 openclose:{label:'開く・閉じる',bridge:'「必要なときに開いて、中のものを使い、終わったら閉じる」',re:/開閉|開く|閉じる|蓋|ふた|ファスナー|チャック|折りたた|折り畳|展開|収束|扇子|傘|蛇腹|筆箱|筆入れ|財布|鞄|かばん|ケース|箱/},
 portable:{label:'持ち運ぶ',bridge:'「使う場所まで持ち運び、必要なときだけ取り出す」',re:/携帯|持ち運|持参|可搬|ポータブル|手持ち|扇子|傘|カメラ|筆箱|筆入れ|財布|鞄|かばん|バッグ|ポーチ|ケース/},
 cover:{label:'覆う',bridge:'「広げた面で、何かを覆ったり遮ったりする」',re:/覆う|覆い|遮る|遮断|日除け|日よけ|雨除け|傘|屋根|皮膚/},
 protect:{label:'守る',bridge:'「外から来るものを弱めて、中を守る」',re:/保護|守る|防ぐ|防止|防御|遮蔽|傘|皮膚|城壁|ファイアウォール/},
 airflow:{label:'風を動かす',bridge:'「空気の流れをつくって、まわりの感じ方を変える」',re:/送風|風を起こ|風を送|あおぐ|扇ぐ|換気|扇子|扇風機/},
 cool:{label:'冷やす',bridge:'「熱を減らして、暑さをやわらげる」',re:/冷却|冷やす|涼|暑さ|扇子|冷蔵庫|エアコン/},
 wash:{label:'洗って落とす',bridge:'「いらないものや汚れを落として、整った状態に戻す」',re:/洗浄|洗う|汚れ|清潔|入浴|風呂|銭湯|洗濯機/},
 restore:{label:'回復する',bridge:'「減ったものを補って、もう一度使える状態に戻す」',re:/回復|疲労|休息|癒|再生|充電|休養|睡眠|銭湯|病院/},
 flow:{label:'流れる',bridge:'「中身が止まらず、場所から場所へ移っていく」',re:/流れる|流動|液体|血液|水分|河川|ジュース|インク|香水/},
 contain:{label:'中に入れる',bridge:'「中身をひとつの範囲に入れて、外へ散らばらないようにする」',re:/容器|収納|入れる|収容|格納|しまう|収める|保存|冷蔵庫|ボトル|箱|ケース|袋|筆箱|筆入れ|財布|鞄|かばん|ポーチ/},
 organize:{label:'整理してしまう',bridge:'「いくつかのものをまとめて、必要なときに取り出しやすくする」',re:/整理|収納|分類|仕分け|しまう|収める|格納|筆箱|筆入れ|工具箱|引き出し|本棚|財布|データベース|図書館/},
 mix:{label:'混ぜる',bridge:'「違うものを混ぜて、ひとつの新しい状態にする」',re:/混合|混ぜる|ブレンド|配合|料理|発酵|ジュース|香水|インク/},
 transform:{label:'形・状態を変える',bridge:'「使う前と後で、形や状態がはっきり変わる」',re:/変形|変化|変換|折りたた|展開|脱皮|発酵|料理|扇子|傘/},
 collect:{label:'集める',bridge:'「ばらばらのものを、いったん同じ場所へ集める」',re:/集める|集合|集積|集団|集まる|駅|港|学校|広場|図書館/},
 distribute:{label:'送り分ける',bridge:'「集まったものを、行き先ごとに分けて送り出す」',re:/分配|配布|配送|送り出|分岐|駅|港|郵便局|交差点/},
 connect:{label:'つなぐ',bridge:'「離れた点どうしをつないで、行き来できるようにする」',re:/接続|つなぐ|ネットワーク|通信|API|駅|インターネット|SNS/},
 branch:{label:'枝分かれする',bridge:'「一つの流れを、複数の行き先へ分ける」',re:/分岐|枝分かれ|経路|交差点|駅|血管|川/},
 filter:{label:'通す・止めるを選ぶ',bridge:'「全部は通さず、条件に合うものだけを通す」',re:/ろ過|濾過|フィルタ|選別|検査|改札|皮膚|ファイアウォール/},
 repeat:{label:'繰り返す',bridge:'「同じ流れを何度も繰り返して、状態を保ったり変えたりする」',re:/反復|繰り返|周期|毎日|習慣|祭り|儀式|洗濯機|睡眠/},
 record:{label:'残してあとで使う',bridge:'「その瞬間の情報を残し、あとから見返せるようにする」',re:/記録|保存|撮影|写真|カメラ|アーカイブ|図書館|記憶/},
 regulate:{label:'動きを調整する',bridge:'「動きすぎたり足りなかったりしないよう、ちょうどよく調整する」',re:/制御|調整|管理|規制|温度調節|交通整理|交差点|冷蔵庫/},
 exchange:{label:'受け渡す',bridge:'「片方からもう片方へ、何かを受け渡す」',re:/交換|取引|受け渡|販売|共有|銀行|市場|コンビニ|API/},
 grow:{label:'育つ',bridge:'「時間と環境の影響を受けながら、少しずつ変わっていく」',re:/成長|発達|育つ|教育|学習|進化|学校|森|温室|種/},
 separate:{label:'内と外を分ける',bridge:'「境目をつくって、内側と外側を分ける」',re:/境界|膜|内外|壁|皮膚|城壁|家|容器/},
 deviate:{label:'決まりから外れる',bridge:'「期待されているやり方や決まりから外れる」',re:/失礼|無礼|違反|逸脱|エラー|タブー|反則/},
 followrule:{label:'決まりに沿う',bridge:'「みんなが共有している決まりに沿って動く」',re:/礼儀|マナー|規則|ルール|プロトコル|校則|ドレスコード|敬語/},
 signal:{label:'意味を伝える',bridge:'「形や言葉そのものより、そこに込めた合図を相手へ伝える」',re:/挨拶|敬語|サイン|信号|合図|礼儀|失礼/},
 expandcompress:{label:'広がる・縮む',bridge:'「広がったり縮んだりしながら働く」',re:/広が|縮む|収縮|膨張|伸縮|扇子|傘|肺|蛇腹|アコーディオン|翼/},
 store:{label:'ためておく',bridge:'「今すぐ使わないものを、中にためてあとで使う」',re:/蓄積|貯蔵|備蓄|ためる|貯める|電池|ダム|種|脂肪|倉庫|記憶/},
 release:{label:'ためたものを出す',bridge:'「中にためたものを、必要なときに外へ出す」',re:/放出|排出|解放|噴出|発射|ダム|電池|汗腺|火山|スプレー/},
 absorb:{label:'吸いこむ',bridge:'「外にあるものを取りこんで、自分の中へ入れる」',re:/吸収|吸い込|吸着|スポンジ|根|肺|腸|掃除機|土壌/},
 reflect:{label:'はね返す',bridge:'「受けたものを、そのまま通さず別の方向へ返す」',re:/反射|反響|跳ね返|鏡|水面|壁|レーダー|エコー/},
 amplify:{label:'大きくする',bridge:'「小さな入力を、もっと大きな動きや信号にして返す」',re:/増幅|拡大|強める|アンプ|拡声器|レンズ|SNS|てこ/},
 dampen:{label:'弱める',bridge:'「強すぎるものを受け止めて、力を小さくする」',re:/減衰|緩衝|吸音|クッション|ダンパー|森|防波堤|耳栓/},
 sync:{label:'タイミングをそろえる',bridge:'「別々に動くもののタイミングを合わせる」',re:/同期|同調|リズム|時計|指揮者|信号機|心拍|メトロノーム/},
 stack:{label:'重ねる',bridge:'「同じ場所に順番に重ねて、まとまりをつくる」',re:/積層|重ねる|層|地層|本棚|スタック|サンドイッチ|年輪/},
 sort:{label:'分けて並べる',bridge:'「違いを見つけて、種類ごとに分けたり並べたりする」',re:/分類|選別|ソート|仕分け|図書館|郵便局|税関|ふるい/},
 switch:{label:'切り替える',bridge:'「条件に合わせて、動き方や行き先を切り替える」',re:/切替|切り替|スイッチ|信号機|ポイント|神経|分岐器|ルーター/},
 trigger:{label:'きっかけで動き出す',bridge:'「ある合図をきっかけに、次の動きが始まる」',re:/引き金|トリガー|反応|きっかけ|ドミノ|センサー|発芽|アラーム/},
 lock:{label:'動かないよう止める',bridge:'「勝手に動いたり開いたりしないよう固定する」',re:/固定|ロック|施錠|鍵|アンカー|ブレーキ|クリップ|関節/},
 balance:{label:'つり合いをとる',bridge:'「片方に偏りすぎないよう、ちょうどいい位置へ戻す」',re:/均衡|バランス|平衡|天秤|シーソー|自律神経|市場|サーモスタット/},
 pulse:{label:'一定の間隔で動く',bridge:'「止まらず、一定の間隔で動きを繰り返す」',re:/脈動|拍動|パルス|心臓|信号|波|点滅|メトロノーム/},
 rotate:{label:'回り続ける',bridge:'「中心のまわりを回りながら働く」',re:/回転|旋回|車輪|扇風機|歯車|惑星|洗濯機|渦/},
 orbit:{label:'中心のまわりを巡る',bridge:'「中心から離れすぎず、まわりを巡り続ける」',re:/公転|軌道|周回|惑星|衛星|電子|通勤|ルーティン/},
 support:{label:'下から支える',bridge:'「自分が土台になって、別のものが動いたり立ったりできるようにする」',re:/支持|支える|土台|柱|骨格|インフラ|根|サーバー/},
 wrap:{label:'包む',bridge:'「外側から包んで、中身をひとまとまりにする」',re:/包装|包む|ラップ|皮|殻|封筒|布団|雲/},

  {id:'related', label:'関連', types:['location','causes','createdBy','related','dictionary']}

const EXAMPLES = ['扇子','傘','帽子','銭湯','学校','駅','森','筆箱','夢','橋'];

// External dictionary / knowledge providers.
// No API keys are required. All providers fail softly.

(() => {
  const WIKT_API = 'https://ja.wiktionary.org/w/api.php';
  const WIKI_API = 'https://ja.wikipedia.org/w/api.php';
  const CONCEPT_API = 'https://api.conceptnet.io';

  const CACHE_PREFIX = 'mw-dict-v3:';

  function normalizeWord(v) {
    return String(v || '').trim()
      .replace(/^[「『]/, '').replace(/[」』]$/, '')
      .replace(/\s+/g, ' ');
  }

  function conceptSlug(word) {
    return encodeURIComponent(normalizeWord(word).replace(/\s+/g, '_'));
  }

  function isUsefulJapaneseWord(word, original='') {
    const w = normalizeWord(word);
    if (!w || w === normalizeWord(original) || w.length > 22) return false;
    if (/[\n\r:#/\\]/.test(w)) return false;
    if (/^(Category|Template|Help|Wiktionary|付録|索引|カテゴリ)/i.test(w)) return false;
    return /[一-龯々〆ヵヶぁ-んァ-ヶA-Za-z0-9]/.test(w);
  }

  async function fetchJSON(url, timeout=5200) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const response = await fetch(url, {
        signal: controller.signal,
        credentials: 'omit',
        headers: { 'Accept': 'application/json' }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function mediawikiURL(base, params) {
    const url = new URL(base);
    Object.entries({ ...params, format: 'json', origin: '*' })
      .forEach(([k, v]) => url.searchParams.set(k, v));
    return url.toString();
  }

  async function mediawiki(base, params, timeout=5200) {
    return fetchJSON(mediawikiURL(base, params), timeout);
  }

  function stripWikiMarkup(input) {
    let s = String(input || '');
    // Keep link label, discard target markup.
    s = s.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, '$2');
    s = s.replace(/\[\[([^\]]+)\]\]/g, '$1');
    s = s.replace(/<ref\b[^>]*>[\s\S]*?<\/ref>/gi, ' ');
    s = s.replace(/<[^>]+>/g, ' ');
    // A few passes are enough for most nested templates.
    for (let i = 0; i < 4; i++) s = s.replace(/\{\{[^{}]*\}\}/g, ' ');
    s = s.replace(/''+/g, '');
    s = s.replace(/={2,}[^=]+={2,}/g, ' ');
    s = s.replace(/[|{}]/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  function japaneseSection(wikitext) {
    const raw = String(wikitext || '');
    const markers = [
      /==\s*\{\{(?:ja|jpn)\}\}\s*==/i,
      /==\s*日本語\s*==/,
      /==\s*Japanese\s*==/i
    ];
    let start = -1;
    for (const re of markers) {
      const m = re.exec(raw);
      if (m) { start = m.index + m[0].length; break; }
    }
    if (start < 0) return raw.slice(0, 12000);
    const rest = raw.slice(start);
    const next = /\n==[^=][\s\S]*?==\s*(?:\n|$)/.exec(rest);
    return (next ? rest.slice(0, next.index) : rest).slice(0, 12000);
  }

  function definitionLines(wikitext) {
    const section = japaneseSection(wikitext);
    const lines = [];
    for (const line of section.split(/\r?\n/)) {
      if (!/^#(?![#*:])/.test(line.trim())) continue;
      const cleaned = stripWikiMarkup(line.replace(/^#+\s*/, ''));
      if (cleaned && cleaned.length >= 2 && cleaned.length <= 280) lines.push(cleaned);
      if (lines.length >= 3) break;
    }
    return lines;
  }

  function cacheGet(key, ttl=1000*60*60*24*10) {
    try {
      const obj = JSON.parse(localStorage.getItem(CACHE_PREFIX + key) || 'null');
      if (!obj || Date.now() - obj.at > ttl) return null;
      return obj.value;
    } catch { return null; }
  }

  function cacheSet(key, value) {
    try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ at:Date.now(), value })); }
    catch {}
  }

  async function getWiktionary(word) {
    const w = normalizeWord(word);
    const cached = cacheGet(`wikt:${w}`);
    if (cached) return cached;

    let parsed = null;
    try {
      parsed = await mediawiki(WIKT_API, {
        action:'parse',
        page:w,
        prop:'wikitext|links',
        redirects:1
      });
    } catch {}

    const raw = parsed?.parse?.wikitext?.['*'] || parsed?.parse?.wikitext || '';
    const defs = definitionLines(raw);
    const links = (parsed?.parse?.links || [])
      .filter(x => Number(x.ns) === 0)
      .map(x => normalizeWord(x['*'] || x.title || ''))
      .filter(x => isUsefulJapaneseWord(x, w))
      .slice(0, 60);

    let search = [];
    try {
      const q = await mediawiki(WIKT_API, {
        action:'query', list:'search', srsearch:w, srnamespace:0,
        srlimit:28, srprop:'snippet'
      });
      search = (q?.query?.search || []).map(x => ({
        word:normalizeWord(x.title),
        snippet:stripWikiMarkup(x.snippet || '')
      })).filter(x => isUsefulJapaneseWord(x.word, w));
    } catch {}

    const value = {
      found: Boolean(parsed?.parse?.title),
      title: parsed?.parse?.title || w,
      definitions: defs,
      rawText: stripWikiMarkup(japaneseSection(raw)).slice(0, 4500),
      links,
      search
    };
    cacheSet(`wikt:${w}`, value);
    return value;
  }

  async function getWikipediaIntro(word) {
    const w = normalizeWord(word);
    const cached = cacheGet(`wiki:${w}`);
    if (cached) return cached;
    let result = { title:w, intro:'', found:false };
    try {
      let j = await mediawiki(WIKI_API, {
        action:'query', titles:w, prop:'extracts',
        exintro:1, explaintext:1, redirects:1
      });
      let pages = Object.values(j?.query?.pages || {});
      let page = pages.find(x => !x.missing);
      if (!page) {
        j = await mediawiki(WIKI_API, {
          action:'query', generator:'search', gsrsearch:w, gsrlimit:3,
          prop:'extracts', exintro:1, explaintext:1, redirects:1
        });
        pages = Object.values(j?.query?.pages || {});
        page = pages.find(x => normalizeWord(x.title) === w) || pages[0];
      }
      if (page && !page.missing) {
        result = {
          title:page.title || w,
          intro:String(page.extract || '').trim().slice(0, 2400),
          found:true
        };
      }
    } catch {}
    cacheSet(`wiki:${w}`, result);
    return result;
  }

  async function getWikipediaIntros(words) {
    const unique = [...new Set(words.map(normalizeWord).filter(Boolean))];
    const result = new Map();
    const missing = [];
    for (const w of unique) {
      const c = cacheGet(`wiki:${w}`);
      if (c) result.set(w, c);
      else missing.push(w);
    }
    for (let i=0; i<missing.length; i+=18) {
      const chunk = missing.slice(i, i+18);
      try {
        const j = await mediawiki(WIKI_API, {
          action:'query', titles:chunk.join('|'), prop:'extracts',
          exintro:1, explaintext:1, redirects:1
        }, 6200);
        const found = new Map();
        for (const page of Object.values(j?.query?.pages || {})) {
          if (page.missing) continue;
          const val = {
            title:page.title || '',
            intro:String(page.extract || '').trim().slice(0, 1800),
            found:true
          };
          found.set(normalizeWord(page.title), val);
          cacheSet(`wiki:${normalizeWord(page.title)}`, val);
        }
        for (const w of chunk) {
          const val = found.get(w) || { title:w, intro:'', found:false };
          result.set(w, val);
          if (!found.has(w)) cacheSet(`wiki:${w}`, val);
        }
      } catch {
        for (const w of chunk) result.set(w, {title:w, intro:'', found:false});
      }
    }
    return result;
  }

  const REL_MAP = {
    Synonym:'synonym', SimilarTo:'similar', RelatedTo:'related',
    IsA:'broader', PartOf:'partOf', HasA:'hasPart',
    UsedFor:'usedFor', CapableOf:'capableOf', HasProperty:'property',
    Antonym:'antonym', AtLocation:'location', Causes:'causes',
    ReceivesAction:'action', MadeOf:'madeOf', CreatedBy:'createdBy',
    DerivedFrom:'related', FormOf:'related', MannerOf:'broader',
    DefinedAs:'synonym', SymbolOf:'related', HasContext:'related'
  };

  function nodeMatchesWord(node, word) {
    if (!node) return false;
    const label = normalizeWord(node.label || '');
    if (label === normalizeWord(word)) return true;
    const slug = normalizeWord(word).replace(/\s+/g, '_');
    return String(node.term || node['@id'] || '').includes(`/c/ja/${encodeURIComponent(slug)}`)
      || String(node.term || node['@id'] || '').endsWith(`/c/ja/${slug}`);
  }

  function relationTypeFor(rel, sourceIsStart) {
    const base = REL_MAP[rel] || 'related';
    if (rel === 'IsA') return sourceIsStart ? 'broader' : 'narrower';
    if (rel === 'PartOf') return sourceIsStart ? 'partOf' : 'hasPart';
    if (rel === 'HasA') return sourceIsStart ? 'hasPart' : 'partOf';
    return base;
  }

  function normalizeConceptEdge(edge, word) {
    const start = edge?.start || {};
    const end = edge?.end || {};
    const sourceIsStart = nodeMatchesWord(start, word);
    const sourceIsEnd = nodeMatchesWord(end, word);
    if (!sourceIsStart && !sourceIsEnd) return null;
    const other = sourceIsStart ? end : start;
    if (other?.language !== 'ja') return null;
    const otherWord = normalizeWord(other.label || '');
    if (!isUsefulJapaneseWord(otherWord, word)) return null;
    const rel = String(edge?.rel?.label || edge?.rel?.['@id'] || '')
      .replace(/^\/r\//, '');
    const dataset = String(edge?.dataset || '');
    const source = /wordnet/i.test(dataset) ? 'WordNet via ConceptNet' : 'ConceptNet';
    return {
      word:otherWord,
      type:relationTypeFor(rel, sourceIsStart),
      relation:rel || 'RelatedTo',
      weight:Number(edge?.weight || 1),
      source,
      evidence:String(edge?.surfaceText || ''),
      direction:sourceIsStart ? 'out' : 'in'
    };
  }

  async function getConceptNet(word) {
    const w = normalizeWord(word);
    const cached = cacheGet(`cn:${w}`, 1000*60*60*24*5);
    if (cached) return cached;
    const slug = conceptSlug(w);

    let lookup = null, related = null;
    try {
      lookup = await fetchJSON(`${CONCEPT_API}/c/ja/${slug}?offset=0&limit=100`, 6200);
    } catch {}
    try {
      const url = new URL(`${CONCEPT_API}/related/c/ja/${slug}`);
      url.searchParams.set('filter', '/c/ja');
      url.searchParams.set('limit', '45');
      related = await fetchJSON(url.toString(), 6200);
    } catch {}

    const relations = (lookup?.edges || [])
      .map(e => normalizeConceptEdge(e, w))
      .filter(Boolean);

    const relatedTerms = (related?.related || [])
      .map(x => {
        const id = String(x['@id'] || '');
        const m = id.match(/^\/c\/ja\/([^/]+)/);
        if (!m) return null;
        let decoded = '';
        try { decoded = decodeURIComponent(m[1]).replace(/_/g, ' '); }
        catch { decoded = m[1].replace(/_/g, ' '); }
        const candidate = normalizeWord(decoded);
        if (!isUsefulJapaneseWord(candidate, w)) return null;
        return { word:candidate, weight:Number(x.weight || 0), type:'related', source:'ConceptNet Numberbatch' };
      }).filter(Boolean);

    const value = { relations, relatedTerms };
    cacheSet(`cn:${w}`, value);
    return value;
  }

  async function getWordSources(word) {
    const w = normalizeWord(word);
    const [wiktionary, wikipedia, conceptnet] = await Promise.all([
      getWiktionary(w).catch(() => ({found:false,definitions:[],rawText:'',links:[],search:[]})),
      getWikipediaIntro(w).catch(() => ({found:false,title:w,intro:''})),
      getConceptNet(w).catch(() => ({relations:[],relatedTerms:[]}))
    ]);
    return { word:w, wiktionary, wikipedia, conceptnet };
  }

  window.MW_PROVIDERS = {
    normalizeWord, isUsefulJapaneseWord, stripWikiMarkup,
    getWiktionary, getWikipediaIntro, getWikipediaIntros,
    getConceptNet, getWordSources
  };
})();

  function unique(arr) { return [...new Set((arr || []).filter(Boolean))]; }

  function inferDomain(text, fallback='その他') {

  function inferTraits(text, useHints=true) {

    const out = [];
    for (const [key, trait] of Object.entries(D.TRAITS)) {
      try {
        if (trait.re) { trait.re.lastIndex = 0; if (trait.re.test(z)) out.push(key); }

  const DIRECT_TRAIT_RELATIONS = new Set(['usedFor','property','capableOf','action']);

  function directTraitEvidence(relations) {
    const traitMap = new Map();
    for (const r of relations || []) {

      const text = `${r.word || ''} ${r.evidence || ''}`.trim();
      const found = inferTraits(text, false);
      for (const t of found) {
        if (!traitMap.has(t)) traitMap.set(t, []);
        traitMap.get(t).push({source:sourceLabel(r), type:r.type, text:text.slice(0,140)});
      }
    }
    return traitMap;
  }

  function traitsFromDirectSources({local=null,sense=null,wiktionary=null,conceptRelations=[]}={}) {
    const evidence = new Map();
    const add = (trait, source, text='') => {
      if (!trait) return;
      if (!evidence.has(trait)) evidence.set(trait, []);
      evidence.get(trait).push({source,text});
    };

    for (const t of local?.tr || []) add(t,'ローカル性質辞典','手動で確認済み');
    for (const t of sense?.traits || []) add(t,'語義設定',sense?.label || '');

    const cn = directTraitEvidence(conceptRelations);
    for (const [t, rows] of cn) for (const row of rows) add(t,row.source,row.text);

    const directDef = compactDefinitionText(wiktionary);
    for (const t of inferTraits(directDef, false)) add(t,'Wiktionary 定義',directDef);

    let traits = [...evidence.keys()].sort((a,b) => traitWeight(b)-traitWeight(a));
    if (local) traits = unique([...(local.tr || []), ...traits]).slice(0,10);
    else traits = traits.slice(0,7);
    return {traits, evidence, directDefinition:directDef};
  }

  function relationEvidenceText(relations) {
    return (relations || []).filter(r => DIRECT_TRAIT_RELATIONS.has(r.type)).map(r =>
      `${r.word || ''} ${r.evidence || ''}`
    ).join(' ');
  }

  function traitWeight(key) { return D.TRAIT_WEIGHTS[key] || 7; }

  function weightedOverlap(a, b) {
    const aa = unique(a), bb = unique(b);
    if (!aa.length || !bb.length) return { shared:[], score:0, coverage:0, jaccard:0 };
    const sb = new Set(bb);
    const shared = aa.filter(x => sb.has(x));
    if (!shared.length) return { shared, score:0, coverage:0, jaccard:0 };
    const sourceTotal = aa.reduce((n,k) => n + traitWeight(k), 0) || 1;
    const sharedTotal = shared.reduce((n,k) => n + traitWeight(k), 0);
    const union = unique([...aa,...bb]);
    const unionTotal = union.reduce((n,k) => n + traitWeight(k), 0) || 1;
    const coverage = sharedTotal / sourceTotal;
    const jaccard = sharedTotal / unionTotal;
    const score = Math.min(1, coverage * .72 + jaccard * .28);
    return { shared, score, coverage, jaccard };
  }

  function sourceLabel(rel) {
    if (!rel) return '';
    if (rel.source === 'WordNet via ConceptNet') return 'WordNet';
    if (/ConceptNet/.test(rel.source || '')) return 'ConceptNet';
    if (/Wiktionary/.test(rel.source || '')) return 'Wiktionary';
    return rel.source || '';
  }

  function dedupeRelations(relations) {
    const map = new Map();
    for (const r of relations || []) {
      if (!r?.word) continue;
      const key = `${r.type}:${r.word}`;
      const prev = map.get(key);
      if (!prev || Number(r.weight || 0) > Number(prev.weight || 0)) map.set(key, r);
    }
    return [...map.values()];
  }

  function relationFromWiktionary(item, type='dictionary') {
    if (!item) return null;
    const word = typeof item === 'string' ? item : item.word;
    if (!word) return null;
    return {
      word:P.normalizeWord(word), type, relation:'Wiktionary',
      weight:type === 'dictionary' ? .35 : .45,
      source:'Wiktionary',
      evidence:typeof item === 'string' ? '' : (item.snippet || '')
    };
  }

  async function buildProfile(word, senseId=null) {
    const w = P.normalizeWord(word);
    const local = localWord(w);
    const sources = await P.getWordSources(w);

    let sense = null;
    if (senseId && D.SENSES[w]) sense = D.SENSES[w].find(x => x.id === senseId) || null;

    const conceptRelations = sources.conceptnet?.relations || [];
    const wiktRelations = [
      ...(sources.wiktionary?.links || []).slice(0,28).map(x => relationFromWiktionary(x)),
      ...(sources.wiktionary?.search || []).slice(0,18).map(x => relationFromWiktionary(x))
    ].filter(Boolean);
    const relations = dedupeRelations([...conceptRelations, ...wiktRelations]);

    const strict = traitsFromDirectSources({
      local, sense, wiktionary:sources.wiktionary, conceptRelations
    });
    const traits = strict.traits;

    const definition = strict.directDefinition
      || sources.wikipedia?.intro?.replace(/\s+/g,' ').slice(0,360)
      || '';

    const classText = [
      w, strict.directDefinition, sources.wikipedia?.intro || '',
      conceptRelations.filter(r => ['broader','narrower'].includes(r.type)).map(r=>r.word).join(' ')
    ].join(' ');
    const domain = sense?.domain || local?.d || inferDomain(classText, 'その他');

    const sourceBadges = [];
    if (local) sourceBadges.push('ローカル性質辞典');
    if (sources.wiktionary?.found) sourceBadges.push('Wiktionary');
    if (sources.wikipedia?.found) sourceBadges.push('Wikipedia（意味補助のみ）');
    if (conceptRelations.length || (sources.conceptnet?.relatedTerms || []).length) sourceBadges.push('ConceptNet');
    if (conceptRelations.some(r => r.source === 'WordNet via ConceptNet')) sourceBadges.push('WordNet');

    return {
      word:w, displayWord:w, domain, traits, definition, traitEvidence:strict.evidence,
      definitions:sources.wiktionary?.definitions || [],
      relations, relatedTerms:sources.conceptnet?.relatedTerms || [],
      wiktionaryLinks:sources.wiktionary?.links || [],
      wiktionarySearch:sources.wiktionary?.search || [],
      sources:unique(sourceBadges), raw:sources
    };
  }

  function mergePoolItem(map, item) {
    if (!item?.word) return;
    const w = P.normalizeWord(item.word);
    if (!P.isUsefulJapaneseWord(w)) return;
    const prev = map.get(w) || {
      word:w, directRelations:[], relatedWeight:0, dictionaryScore:0, sourceHints:[]
    };
    if (item.relation) prev.directRelations.push(item.relation);
    if (item.relatedWeight) prev.relatedWeight = Math.max(prev.relatedWeight, item.relatedWeight);
    if (item.dictionaryScore) prev.dictionaryScore = Math.max(prev.dictionaryScore, item.dictionaryScore);
    if (item.source) prev.sourceHints.push(item.source);
    map.set(w, prev);
  }

  function poolFromProfile(profile) {
    const map = new Map();

    // Curated seed dictionary = stable backbone.
    for (const x of D.SEED_WORDS) {
      mergePoolItem(map, {word:x.t, source:'ローカル性質辞典'});
    }

    for (const r of profile.relations || []) {
      mergePoolItem(map, {
        word:r.word, relation:r, source:sourceLabel(r),
        dictionaryScore:DIRECT_RELATION_STRENGTH[r.type] || .3
      });
    }

    for (const r of profile.relatedTerms || []) {
      mergePoolItem(map, {
        word:r.word, relatedWeight:Number(r.weight || 0),
        source:r.source || 'ConceptNet Numberbatch'
      });
    }

    for (const x of (profile.wiktionaryLinks || []).slice(0,45)) {
      mergePoolItem(map, {word:x, dictionaryScore:.22, source:'Wiktionary'});
    }
    for (const x of (profile.wiktionarySearch || []).slice(0,28)) {
      mergePoolItem(map, {word:x.word, dictionaryScore:.26, source:'Wiktionary'});
    }

    map.delete(profile.word);
    return [...map.values()];
  }

  async function buildGalaxyCandidates(profile, onProgress=()=>{}) {
    const pool = poolFromProfile(profile);

    const unknown = pool
      .filter(x => !localWord(x.word))
      .sort((a,b) => (b.dictionaryScore+b.relatedWeight) - (a.dictionaryScore+a.relatedWeight))
      .slice(0,22);

    const externalProfiles = new Map();
    if (unknown.length) onProgress(`辞書から${unknown.length}語の「直接わかる性質」だけ確認中…`);

    let cursor = 0;
    const workers = Array.from({length:Math.min(5,unknown.length)}, async () => {
      while (cursor < unknown.length) {
        const item = unknown[cursor++];
        try {
          const [wikt, cn] = await Promise.all([
            P.getWiktionary(item.word).catch(()=>({found:false,definitions:[]})),
            P.getConceptNet(item.word).catch(()=>({relations:[],relatedTerms:[]}))
          ]);
          const strict = traitsFromDirectSources({wiktionary:wikt, conceptRelations:cn.relations || []});
          const def = strict.directDefinition || '';
          const classText = [item.word, def,
            (cn.relations||[]).filter(r=>['broader','narrower'].includes(r.type)).map(r=>r.word).join(' ')
          ].join(' ');
          externalProfiles.set(item.word,{
            traits:strict.traits, traitEvidence:strict.evidence,
            domain:inferDomain(classText,'その他'), definition:def
          });
        } catch {}
      }
    });
    await Promise.all(workers);

    const candidates = [];
    for (const item of pool) {
      const local = localWord(item.word);
      const ext = externalProfiles.get(item.word);
      const traits = local?.tr ? [...local.tr] : (ext?.traits || []);
      const domain = local?.d || ext?.domain || 'その他';
      const intro = ext?.definition || '';

      const overlap = weightedOverlap(profile.traits, traits);
      if (!overlap.shared.length) continue;

      const directStrength = (item.directRelations || []).reduce((m,r) =>
        Math.max(m, DIRECT_RELATION_STRENGTH[r.type] || 0), 0);
      const semantic = Math.max(0, Math.min(1, item.relatedWeight || 0));
      const similarity = Math.min(1, overlap.score * .86 + semantic * .10 + directStrength * .04);

      candidates.push({
        word:item.word, domain, traits, sharedTraits:overlap.shared,
        similarity, coverage:overlap.coverage, jaccard:overlap.jaccard,
        relatedWeight:semantic, directRelations:item.directRelations || [],
        sources:unique(item.sourceHints), definition:intro,
        traitEvidence:local ? null : ext?.traitEvidence
      });
    }

    candidates.sort((a,b) =>
      b.similarity - a.similarity ||
      b.sharedTraits.length - a.sharedTraits.length ||
      a.word.localeCompare(b.word,'ja')
    );
    return candidates;
  }

  function dictionaryGroups(profile, candidates) {
    const groups = D.RELATION_GROUPS.map(g => ({...g, items:[]}));
    const byId = new Map(groups.map(g => [g.id, g]));
    const relationMap = new Map();

    for (const r of profile.relations || []) {
      const key = `${r.type}:${r.word}`;
      if (!relationMap.has(key)) relationMap.set(key, r);
    }

    for (const g of groups) {
      const items = [];
      for (const r of relationMap.values()) {
        if (!g.types.includes(r.type)) continue;
        items.push({
          word:r.word, type:r.type,
          label:D.RELATION_LABELS[r.type] || r.type,
          weight:Number(r.weight || 0),
          source:sourceLabel(r)
        });
      }
      // Related endpoint fills the generic "関連" row.
      if (g.id === 'related') {
        for (const r of (profile.relatedTerms || []).slice(0,18)) {
          if (items.some(x => x.word === r.word)) continue;
          items.push({
            word:r.word, type:'related', label:'関連',
            weight:Number(r.weight || 0), source:'ConceptNet'
          });
        }
      }
      g.items = items
        .sort((a,b) => b.weight-a.weight)
        .filter((x,i,arr) => arr.findIndex(y => y.word === x.word) === i)
        .slice(0,18);
    }

    // "同じ性質" is the app's original strength and belongs in the dictionary too.
    const shared = candidates.slice(0,18).map(x => ({
      word:x.word, type:'sharedTrait',
      label:x.sharedTraits.map(t => D.TRAITS[t]?.label || t).join('・'),
      weight:x.similarity, source:'ことばの森'
    }));
    groups.splice(4, 0, {id:'shared', label:'同じ性質', types:['sharedTrait'], items:shared});

    return groups.filter(g => g.items.length);
  }

  function domainDistance(a, b) {
    if (a === b) return 0;
    const ga = DOMAIN_GROUP[a] || a || 'other';
    const gb = DOMAIN_GROUP[b] || b || 'other';
    if (ga === gb) return 1;
    if (ga === 'cosmic' || gb === 'cosmic') return 3;
    return 2;
  }

  window.MW_ENGINE = {
    localWord, inferTraits, inferDomain, weightedOverlap,
    buildProfile, buildGalaxyCandidates, dictionaryGroups,
    domainDistance
  };
})();


// Forest map renderer. Distance from the trunk is driven primarily by shared-trait similarity.

(() => {
  const D = window.MW_DATA;

  function hashWord(word) {
    let h = 2166136261;
    for (const ch of String(word || '')) {
      h ^= ch.codePointAt(0);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0) / 4294967295;
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function computePositions(candidates, width, height) {
    const min = Math.min(width, height);
    const cx = width / 2, cy = height / 2;
    const minR = min * .18;
    const maxR = min * .455;
    const golden = Math.PI * (3 - Math.sqrt(5));
    const points = candidates.map((c, i) => {
      const similarity = clamp(Number(c.similarity || 0), 0, 1);
      const targetR = minR + (1 - similarity) * (maxR - minR);
      const angle = -Math.PI/2 + i * golden + hashWord(c.word) * .48;
      return {
        x:cx + Math.cos(angle) * targetR,
        y:cy + Math.sin(angle) * targetR,
        targetR,
        angle,
        candidate:c
      };
    });

    // Gentle collision relaxation. Keep each point near its intended radius.
    const nodeRadius = p => {
      const s = clamp(Number(p.candidate.similarity || 0), 0, 1);
      return 13 + s * 18;
    };

    for (let iter=0; iter<34; iter++) {
      for (let i=0; i<points.length; i++) {
        const a = points[i];
        for (let j=i+1; j<points.length; j++) {
          const b = points[j];
          let dx=b.x-a.x, dy=b.y-a.y;
          let d=Math.hypot(dx,dy) || .001;
          const want=nodeRadius(a)+nodeRadius(b)+7;
          if (d >= want) continue;
          const push=(want-d)*.17;
          dx/=d; dy/=d;
          a.x-=dx*push; a.y-=dy*push;
          b.x+=dx*push; b.y+=dy*push;
        }
      }
      for (const p of points) {
        let dx=p.x-cx, dy=p.y-cy, r=Math.hypot(dx,dy)||1;
        const desired=p.targetR;
        const pull=(desired-r)*.13;
        p.x += dx/r*pull;
        p.y += dy/r*pull;
        const margin=24;
        p.x=clamp(p.x,margin,width-margin);
        p.y=clamp(p.y,margin,height-margin);
      }
    }
    return points;
  }

  function drawActiveLine(galaxy, node, line) {
    if (!galaxy || !node || !line) return;
    const gr = galaxy.getBoundingClientRect();
    const nr = node.getBoundingClientRect();
    const cx = gr.width/2, cy = gr.height/2;
    const tx = nr.left-gr.left+nr.width/2;
    const ty = nr.top-gr.top+nr.height/2;
    const dist = Math.hypot(tx-cx,ty-cy);
    const angle = Math.atan2(ty-cy,tx-cx)*180/Math.PI;
    line.hidden=false;
    line.style.left=`${cx}px`;
    line.style.top=`${cy}px`;
    line.style.width=`${dist}px`;
    line.style.transform=`rotate(${angle}deg)`;
  }

  function render({galaxy, nodesLayer, activeLine, centerWord, candidates, onSelect}) {
    if (!galaxy || !nodesLayer) return;
    nodesLayer.innerHTML='';
    if (activeLine) activeLine.hidden=true;

    const rect=galaxy.getBoundingClientRect();
    const points=computePositions(candidates, rect.width || 600, rect.height || 520);

    points.forEach((p, i) => {
      const c=p.candidate;
      const b=document.createElement('button');
      b.type='button';
      b.className='galaxy-node';
      b.dataset.index=String(i);
      b.style.left=`${p.x}px`;
      b.style.top=`${p.y}px`;
      const size=30 + c.similarity*34;
      b.style.setProperty('--node-size',`${size}px`);
      b.innerHTML=`<span>${escapeHTML(c.word)}</span>`;
      b.title=`共通する性質：${c.sharedTraits.map(k=>D.TRAITS[k]?.label||k).join('・')}`;
      b.addEventListener('click', () => {
        nodesLayer.querySelectorAll('.galaxy-node').forEach(n => n.classList.remove('active'));
        b.classList.add('active');
        drawActiveLine(galaxy,b,activeLine);
        onSelect?.(c);
      });
      nodesLayer.appendChild(b);
    });

    const core=galaxy.querySelector('.galaxy-core strong');
    if (core) core.textContent=centerWord;
  }

  function escapeHTML(v) {
    return String(v ?? '').replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  window.MW_GALAXY = { render, computePositions };
})();

      setStatus(`「${word}」を辞書で調べてる`,true);
    }

    let profile;
    try {
      profile=await E.buildProfile(word,senseId);
    } catch (err) {
      console.error(err);
      setStatus('辞書の取得に失敗したけど、ローカル辞典で続けるで。');
      profile={
        word,displayWord:word,domain:'その他',traits:E.localWord(word)?.tr||[],
        definition:'',relations:[],relatedTerms:[],wiktionaryLinks:[],wiktionarySearch:[],
        sources:E.localWord(word)?['ローカル性質辞典']:[],raw:{}
      };
    }
    if (token!==state.token) return;
    state.profile=profile;
    renderDictionary(profile,[]);
    setVisible('#dictionaryCard',true);

    setStatus(`直接確認できた性質 ${profile.traits.length}個。関係の枝を広げてる`,true);
    let candidates=[];
    try {
      candidates=await E.buildGalaxyCandidates(profile,msg=>{
        if(token===state.token)setStatus(msg,true);
      });
    } catch(err) {
      console.error(err);
    }
    if (token!==state.token) return;
    state.candidates=candidates;
    renderDictionary(profile,candidates);
    renderGalaxy();
    setVisible('#galaxyCard',true);

    const external = candidates.filter(c=>!E.localWord(c.word)).length;
    setStatus(
      candidates.length
        ? `${candidates.length}語の枝を表示。共通する性質が0個の言葉は図に入れてへんで。${external?` 辞書由来 +${external}語。`:''}`
        : '直接確認できた共通性質の枝はまだ見つからへんかった。辞書の関係語は上の「関係をたどる」に残してあるで。'
    );
  }

  function renderDictionary(profile,candidates) {
    $('#dictWord').textContent=profile.displayWord||profile.word;
    $('#dictDomain').textContent=profile.domain||'';
    const definition=profile.definition
      ? profile.definition.replace(/\s+/g,' ').slice(0,360)
      : '意味の本文は取得できなかったけど、関係データと性質から探せるで。';
    $('#definition').textContent=definition;

    $('#sourceBadges').innerHTML=(profile.sources||[])
      .map(s=>`<span class="badge">${esc(s)}</span>`).join('');

    $('#traits').innerHTML=(profile.traits||[]).length
      ? profile.traits.map(t=>{
          const ev=profile.traitEvidence?.get?.(t) || [];
          const src=[...new Set(ev.map(x=>x.source).filter(Boolean))].join(' / ');
          return `<span class="trait"${src?` title="確認元: ${esc(src)}"`:''}>${esc(D.TRAITS[t]?.label||t)}</span>`;
        }).join('')
      : '<span class="badge">直接確認できる性質はまだ見つかってへん</span>';

    const groups=E.dictionaryGroups(profile,candidates);
    const box=$('#relationGroups');
    box.innerHTML='';
    for (const g of groups) {
      const row=document.createElement('div');
      row.className='relation-group';
      const label=document.createElement('div');
      label.className='relation-label'; label.textContent=g.label;
      const words=document.createElement('div'); words.className='relation-words';
      g.items.slice(0,14).forEach(item=>{
        const b=document.createElement('button');
        b.type='button'; b.className='relation-word';
        const hint=item.type==='sharedTrait'
          ? item.label
          : (D.RELATION_LABELS[item.type]||item.label||'');
        b.innerHTML=`${esc(item.word)}${hint?`<small>${esc(hint)}</small>`:''}`;
        b.title=item.source?`出典: ${item.source}`:'';
        b.addEventListener('click',()=>{
          $('#query').value=item.word;
          beginSearch(item.word);
          window.scrollTo({top:0,behavior:'smooth'});
        });
        words.appendChild(b);
      });
      row.append(label,words); box.appendChild(row);
    }
    if (!groups.length) box.innerHTML='<div class="badge">関係語はまだ見つかってへん</div>';
  }

  function renderGalaxy() {
    const card=$('#galaxyCard');
    if (card.hidden) card.hidden=false;
    $('#galaxyCount').textContent=`${state.candidates.length}語`;
    const empty=$('#emptyGalaxy');
    empty.hidden=state.candidates.length>0;
    G.render({
      galaxy:$('#galaxy'),
      nodesLayer:$('#nodesLayer'),
      activeLine:$('#activeLine'),
      centerWord:state.profile?.displayWord||state.word,
      candidates:state.candidates,
      onSelect:openCompare
    });
  }

  function openCompare(candidate) {
    state.selected=candidate;
    $('#compareTitle').textContent=`${state.profile.displayWord||state.word} ⇄ ${candidate.word}`;
    $('#commonTraits').innerHTML=candidate.sharedTraits
      .map(t=>`<span class="common-trait">${esc(D.TRAITS[t]?.label||t)}</span>`).join('');
    renderTraitVisual(candidate.sharedTraits);
    setVisible('#compareCard',true);
    $('#compareCard').scrollIntoView({behavior:'smooth',block:'start'});
  }

  function renderTraitVisual(traits) {
    const box=$('#traitVisual');
    const ordered=[...traits].sort((a,b)=>(D.TRAIT_WEIGHTS[b]||0)-(D.TRAIT_WEIGHTS[a]||0));
    box.innerHTML=ordered.slice(0,4).map(t=>{
      const v=VISUALS[t]||['状態A','状態B','→'];
      return `<div class="trait-visual-row">
        <div class="visual-box">${esc(v[0])}</div>
        <div class="visual-arrow">${esc(v[2])}</div>
        <div class="visual-box">${esc(v[1])}</div>
        <div class="visual-name">${esc(D.TRAITS[t]?.label||t)}</div>
      </div>`;
    }).join('');
  }

  let resizeTimer=0;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{if(state.profile&&$('#galaxyCard')&&!$('#galaxyCard').hidden)renderGalaxy()},160);
  });

  $('#searchForm').addEventListener('submit',e=>{
    e.preventDefault();
    beginSearch($('#query').value);
  });

  renderExamples();
  $('#query').value='扇子';
  beginSearch('扇子');
})();

</script>
</body>
</html>
